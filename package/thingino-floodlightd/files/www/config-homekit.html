<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>thingino · HomeKit</title>
  <script src="/a/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/a/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/a/main.css">
</head>
<body id="page-config-homekit">
<nav data-app-nav></nav>
<main class="pb-4">
  <div class="container" style="min-height:80vh">
    <div data-app-controls></div>
    <section class="row justify-content-center">
      <div class="col-12 col-lg-7">
        <div class="card mt-3">
          <div class="card-header d-flex justify-content-between align-items-center">
            <div>
              <h2 class="card-title mb-0">HomeKit</h2>
              <small>Pair this floodlight with Apple Home.</small>
            </div>
            <span id="homekit-status" class="badge text-bg-secondary">Checking…</span>
          </div>
          <div class="card-body">
            <p id="homekit-message" class="mb-0">Checking HomeKit pairing status.</p>
          </div>
        </div>
        <div class="card border-danger mt-3">
          <div class="card-header text-bg-danger">
            <h2 class="card-title mb-0">Reset HomeKit pairing</h2>
          </div>
          <div class="card-body">
            <p>Remove this camera from Apple Home before resetting. Resetting deletes only HomeKit pairing data; it does not change camera, network, or floodlight settings.</p>
            <button id="homekit-reset" type="button" class="btn btn-danger">Reset pairing</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
<footer data-app-footer></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/a/main.js"></script>
<script src="/a/runtime-config.js"></script>
<script src="/a/plugins.js"></script>
<script src="/a/control-bar.js"></script>
<script src="/a/navigation.js"></script>
<script src="/a/footer.js"></script>
<script src="/a/config-homekit.js"></script>
</body>
</html>
