<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>thingino · HomeKit</title>
  <script src="/a/theme-init.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/a/main.css">
</head>
<body>
<nav data-app-nav></nav>
<main class="pb-4">
  <div class="container">
    <div data-app-controls></div>
    <section class="row justify-content-center">
      <div class="col-12 col-lg-7">
        <div class="card mt-3">
          <div class="card-header d-flex justify-content-between">
            <h2 class="card-title mb-0">HomeKit</h2>
            <span id="status" class="badge text-bg-secondary">Checking…</span>
          </div>
          <div class="card-body">
            <p id="details">The primary camera feed and supported camera controls are available through HomeKit.</p>
            <p id="code" class="font-monospace"></p>
            <button id="qr" class="btn btn-primary">Generate pairing QR code</button>
            <button id="reset" class="btn btn-outline-danger ms-2">Reset pairing and QR code</button>
            <div id="qr-wrap" class="mt-3 d-none">
              <img id="qr-image" alt="HomeKit pairing QR code" class="bg-white p-2">
              <p class="small text-secondary mt-2">In Apple Home, choose Add Accessory and scan this code.</p>
            </div>
          </div>
        </div>
        <div id="floodlight-card" class="card mt-3 d-none" hidden>
          <div class="card-header d-flex justify-content-between">
            <h2 class="card-title mb-0">Wyze Floodlight v1</h2>
            <span id="floodlight-status" class="badge text-bg-secondary">Checking…</span>
          </div>
          <div class="card-body">
            <label for="floodlight-brightness" class="form-label d-flex justify-content-between">
              <span>Brightness</span><strong id="floodlight-brightness-value">100%</strong>
            </label>
            <input id="floodlight-brightness" class="form-range" type="range" min="1" max="100" value="100">
            <div class="d-flex gap-2">
              <button id="floodlight-on" class="btn btn-warning" type="button">Turn on</button>
              <button id="floodlight-off" class="btn btn-outline-secondary" type="button">Turn off</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
<footer data-app-footer></footer>
<script src="/a/main.js"></script>
<script src="/a/runtime-config.js"></script>
<script src="/a/plugins.js"></script>
<script src="/a/control-bar.js"></script>
<script src="/a/navigation.js"></script>
<script src="/a/footer.js"></script>
<script src="/a/config-homekit.js"></script>
</body>
</html>
